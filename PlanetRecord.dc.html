<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Manrope:wght@300;400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;family=Playfair+Display:ital,wght@0,500;0,600;1,500&amp;display=swap" rel="stylesheet">
<style>
  @keyframes planetSpin { from{transform:translateX(0)} to{transform:translateX(-50%)} }
  @keyframes moonOrbit { to{transform:translate(-50%,-50%) rotate(360deg)} }
  @keyframes atmosPulse { 0%,100%{opacity:.55; transform:translate(-50%,-50%) scale(1)} 50%{opacity:.95; transform:translate(-50%,-50%) scale(1.06)} }
  @keyframes hudSpin { to{transform:translate(-50%,-50%) rotate(360deg)} }
  @keyframes recRise { from{opacity:0; transform:translateY(22px)} to{opacity:1; transform:none} }
</style>
</helmet>

<section style="position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:clamp(34px,6vh,72px) clamp(20px,5vw,56px);">
  <div style="display:grid; grid-template-columns:1.02fr 1fr; gap:clamp(24px,4vw,56px); align-items:center;">

    <!-- LEFT: the planet -->
    <div style="position:relative; width:100%; min-height:380px; height:42vw; max-height:460px;">
      <div ref="{{ planetHostRef }}" style="position:absolute; inset:0;"></div>
      <!-- precision corner coordinates -->
      <div style="position:absolute; top:8px; left:10px; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.1em; color:{{ accentDim }};">R.A {{ ra }}</div>
      <div style="position:absolute; top:8px; right:10px; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.1em; color:{{ accentDim }};">DEC {{ dec }}</div>
      <div style="position:absolute; bottom:8px; left:10px; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.1em; color:{{ accentDim }};">{{ code }}</div>
      <div style="position:absolute; bottom:8px; right:10px; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.1em; color:{{ accentDim }};">SYS · PARALLED</div>
    </div>

    <!-- RIGHT: the record -->
    <div style="animation:recRise .8s ease both;">
      <div style="font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.22em; color:{{ accent }}; margin-bottom:14px;">PLANETARY RECORD</div>
      <h2 style="font-family:'Playfair Display',serif; font-weight:600; font-size:clamp(30px,4vw,52px); line-height:1; letter-spacing:-.02em; margin:0 0 8px; color:#fff;">{{ title }}</h2>
      <div style="font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.12em; color:rgba(255,255,255,.45); margin-bottom:22px;">{{ code }}</div>

      <!-- stat rows -->
      <div style="display:flex; flex-direction:column; gap:0; border-top:1px solid rgba(255,255,255,.12); margin-bottom:24px;">
        <div style="display:flex; justify-content:space-between; gap:16px; padding:11px 0; border-bottom:1px solid rgba(255,255,255,.08);">
          <span style="font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.12em; color:rgba(255,255,255,.4);">CLASS</span>
          <span style="font-size:13.5px; color:rgba(255,255,255,.82); text-align:right;">{{ ptype }}</span>
        </div>
        <div style="display:flex; justify-content:space-between; gap:16px; padding:11px 0; border-bottom:1px solid rgba(255,255,255,.08);">
          <span style="font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.12em; color:rgba(255,255,255,.4);">ORBIT</span>
          <span style="font-size:13.5px; color:rgba(255,255,255,.82); text-align:right;">{{ orbit }}</span>
        </div>
      </div>

      <!-- strata -->
      <div style="display:flex; flex-direction:column; gap:12px; margin-bottom:24px;">
        <div style="display:flex; align-items:flex-start; gap:14px;">
          <span style="flex:none; width:74px; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.1em; color:{{ accent }}; padding-top:3px;">SURFACE</span>
          <span style="flex:1; font-size:14px; line-height:1.5; color:rgba(255,255,255,.78);">{{ surface }}</span>
        </div>
        <div style="display:flex; align-items:flex-start; gap:14px;">
          <span style="flex:none; width:74px; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.1em; color:{{ accent }}; padding-top:3px;">ATMOS</span>
          <span style="flex:1; font-size:14px; line-height:1.5; color:rgba(255,255,255,.78);">{{ atmosphere }}</span>
        </div>
        <div style="display:flex; align-items:flex-start; gap:14px;">
          <span style="flex:none; width:74px; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.1em; color:{{ accent }}; padding-top:3px;">CORE</span>
          <span style="flex:1; font-size:14px; line-height:1.5; color:rgba(255,255,255,.78);">{{ core }}</span>
        </div>
      </div>

      <!-- satellites -->
      <div style="font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.14em; color:rgba(255,255,255,.4); margin-bottom:10px;">SATELLITES</div>
      <div style="display:flex; flex-wrap:wrap; gap:8px;">
        <sc-for list="{{ sats }}" as="s" hint-placeholder-count="4">
          <span style="font-size:12.5px; color:rgba(255,255,255,.82); padding:7px 13px; border-radius:999px; border:1px solid {{ accentBorder }}; background:{{ accentBg }};">{{ s }}</span>
        </sc-for>
      </div>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:480}}">
class Component extends DCLogic {
  buildPlanet() {
    const host = this.host;
    if (!host || host.dataset.built) return;
    host.dataset.built = '1';
    const p = this.props;
    const c1 = p.c1 || '#cdbcff', c2 = p.c2 || '#7a5fd6', c3 = p.c3 || '#2a1860';
    const glow = p.glow || '155,123,255', accent = p.accent || '#bca8ff';
    const ring = String(p.ring) === 'true';
    const moons = Math.max(0, parseInt(p.moons || '1', 10));

    const pat = "position:relative;flex:none;width:50%;height:100%;background:"
      + "radial-gradient(ellipse 30% 16% at 20% 28%, rgba(255,255,255,.22), transparent 60%),"
      + "radial-gradient(ellipse 22% 14% at 66% 64%, " + c3 + ", transparent 62%),"
      + "radial-gradient(ellipse 24% 15% at 44% 84%, rgba(255,255,255,.12), transparent 60%),"
      + "radial-gradient(ellipse 18% 12% at 86% 30%, " + c3 + ", transparent 60%),"
      + "radial-gradient(ellipse 16% 11% at 8% 72%, " + c1 + ", transparent 60%),"
      + "linear-gradient(180deg, " + c2 + ", " + c1 + " 46%, " + c2 + ")";
    const cloud = "position:relative;flex:none;width:50%;height:100%;background:"
      + "radial-gradient(ellipse 26% 9% at 30% 36%, rgba(255,255,255,.45), transparent 60%),"
      + "radial-gradient(ellipse 30% 11% at 72% 60%, rgba(255,255,255,.32), transparent 62%),"
      + "radial-gradient(ellipse 20% 8% at 50% 82%, rgba(255,255,255,.3), transparent 60%)";

    const atmos = '<div style="position:absolute;left:50%;top:50%;width:88%;height:88%;border-radius:50%;background:radial-gradient(circle, rgba(' + glow + ',.38), transparent 64%);filter:blur(10px);animation:atmosPulse 6s ease-in-out infinite;"></div>';

    const ringHtml = ring
      ? '<div style="position:absolute;left:50%;top:50%;width:96%;height:32%;transform:translate(-50%,-50%) rotate(-22deg);border-radius:50%;background:radial-gradient(ellipse at center, transparent 38%, rgba(' + glow + ',.55) 40%, rgba(' + glow + ',.12) 49%, transparent 56%);z-index:1;"></div>'
      : '';

    // HUD tick ring
    let ticks = '';
    for (let i = 0; i < 24; i++) {
      const long = i % 6 === 0;
      ticks += '<div style="position:absolute;left:50%;top:50%;width:0;height:0;transform:rotate(' + (i * 15) + 'deg) translateY(-46%);"><div style="width:1px;height:' + (long ? 11 : 5) + 'px;background:rgba(' + glow + ',' + (long ? .6 : .3) + ');margin:0 auto;"></div></div>';
    }
    const hud = '<div style="position:absolute;left:50%;top:50%;width:78%;height:78%;transform:translate(-50%,-50%);animation:hudSpin 80s linear infinite;">' + ticks + '</div>';

    const sphere = '<div style="position:absolute;left:50%;top:50%;width:52%;height:52%;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;z-index:2;box-shadow:inset -22px -16px 46px rgba(0,0,0,.62), inset 12px 10px 30px rgba(255,255,255,.10), 0 0 50px rgba(' + glow + ',.45);">'
      + '<div style="position:absolute;inset:0;display:flex;width:200%;animation:planetSpin 26s linear infinite;"><div style="' + pat + '"></div><div style="' + pat + '"></div></div>'
      + '<div style="position:absolute;inset:0;display:flex;width:200%;opacity:.5;filter:blur(1px);animation:planetSpin 40s linear infinite;"><div style="' + cloud + '"></div><div style="' + cloud + '"></div></div>'
      + '<div style="position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 32% 26%, rgba(255,255,255,.42), transparent 34%);"></div>'
      + '<div style="position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 42px 8px rgba(0,0,0,.5);"></div>'
      + '</div>';

    let moonHtml = '';
    for (let i = 0; i < moons; i++) {
      const d = 66 + i * 16;
      const dur = 11 + i * 7;
      const ms = 6 - i;
      moonHtml += '<div style="position:absolute;left:50%;top:50%;width:' + d + '%;height:' + d + '%;transform:translate(-50%,-50%);border-radius:50%;animation:moonOrbit ' + dur + 's linear ' + (i * -3) + 's infinite;z-index:' + (i % 2 ? 3 : 0) + ';"><div style="position:absolute;top:0;left:50%;transform:translate(-50%,-50%);width:' + ms + '%;height:' + ms + '%;border-radius:50%;background:radial-gradient(circle at 36% 30%, #fff, ' + accent + ' 70%, #222);box-shadow:0 0 10px rgba(' + glow + ',.7);"></div></div>';
    }

    host.innerHTML = atmos + hud + ringHtml + sphere + moonHtml;
  }

  componentDidMount() { this.buildPlanet(); }

  renderVals() {
    const p = this.props;
    const accent = p.accent || '#bca8ff';
    const glow = p.glow || '155,123,255';
    const sats = (p.sats || '').split('|').map(s => s.trim()).filter(Boolean);
    return {
      planetHostRef: (el) => { this.host = el; this.buildPlanet(); },
      title: p.title || 'World',
      code: p.code || 'PRL-00',
      ptype: p.ptype || '',
      orbit: p.orbit || '',
      surface: p.surface || '',
      atmosphere: p.atmosphere || '',
      core: p.core || '',
      sats,
      ra: p.ra || '14h22m',
      dec: p.dec || '+08°41′',
      accent,
      accentDim: 'rgba(' + glow + ',.55)',
      accentBorder: 'rgba(' + glow + ',.32)',
      accentBg: 'rgba(' + glow + ',.08)'
    };
  }
}
</script>
</body>
</html>
